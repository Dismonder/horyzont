name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HORYZONT_COMMIT: ${{ github.sha }}

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Horyzont.sln

      - name: Build
        run: dotnet build Horyzont.sln -c Release --no-restore

      - name: Test
        run: dotnet test Horyzont.sln -c Release --no-build --filter "Category!=Soak&Category!=Manual"

      - name: Format
        run: dotnet format Horyzont.sln --verify-no-changes --no-restore
