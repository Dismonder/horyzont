name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HORYZONT_COMMIT: ${{ github.sha }}
  # Self-hosted runner: MSBuild worker nodes left alive after a job keep DLLs from the workspace .nuget folder loaded,
  # so the next checkout cannot clean the workspace and hangs.
  MSBUILDDISABLENODEREUSE: 1
  DOTNET_CLI_USE_MSBUILD_SERVER: 0

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux CI off until a free Linux runner exists (owner decision 2026-10-09, self-hosted Windows only).
        # os: [windows-latest, ubuntu-latest]
        os: [windows-latest]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        # Self-hosted Windows uses the installed .NET SDK: the action cannot write to C:\Program Files\dotnet without admin rights.
        if: runner.environment == 'github-hosted'
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Horyzont.sln

      - name: Build
        run: dotnet build Horyzont.sln -c Release --no-restore

      - name: Test
        run: dotnet test Horyzont.sln -c Release --no-build --filter "Category!=Soak&Category!=Manual"

      - name: Format
        run: dotnet format Horyzont.sln --verify-no-changes --no-restore

  game:
    # Needs the engine from engine.yml on main: the build-and-test runners above have no engine packages.
    name: game (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            editor-artifact: engine-windows-editor
            editor: godot.windows.editor.double.x86_64.mono.console.exe
          # Linux CI off until a free Linux runner exists (owner decision 2026-10-09, self-hosted Windows only).
          # - os: ubuntu-latest
          #   editor-artifact: engine-linux-editor
          #   editor: godot.linuxbsd.editor.double.x86_64.mono
    runs-on: [self-hosted, Windows, X64]
    # 45 -> 60 (K4-19): modes smoke, 3 minute co-op smoke and the benchmark report.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        # Self-hosted Windows uses the installed .NET SDK: the action cannot write to C:\Program Files\dotnet without admin rights.
        if: runner.environment == 'github-hosted'
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        # Self-hosted Windows uses the system Python 3.12: the action's installer needs admin rights (HKLM) and hangs there.
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - name: Download engine from the last successful engine.yml run on main
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow engine.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful engine.yml run on main; merge K1-01 and let engine.yml finish first."
            exit 1
          fi
          echo "engine run $run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "${{ matrix.editor-artifact }}" -D engine-ci/editor
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-nupkgs -D engine-ci/nupkgs
          # upload-artifact drops the executable bit.
          chmod +x "engine-ci/editor/${{ matrix.editor }}" || true

      # Linux CI off until a free Linux runner exists (owner decision 2026-10-09, self-hosted Windows only).
      # - name: Prepare the Linux editor
      #   if: runner.os == 'Linux'
      #   run: |
      #     chmod +x engine-ci/editor/${{ matrix.editor }}
      #     sudo apt-get update
      #     sudo apt-get install -y libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1 libasound2t64 libpulse0 libudev1 libfontconfig1

      - name: Activate engine packages
        run: python tools/engine/build.py activate --from engine-ci/nupkgs

      - name: Build game
        run: dotnet build game/Horyzont.Game.csproj -nologo

      - name: Format game
        run: dotnet format game/Horyzont.Game.csproj --verify-no-changes --no-restore

      - name: Boot smoke
        run: |
          editor="$PWD/engine-ci/editor/${{ matrix.editor }}"
          # Godot 4.7.2 shutdown bug (docs/plans/K2-12-budowle.md, Odstepstwa): if the editor help cache thread
          # finishes after --import has quit, its deferred call runs after EditorNode is freed and segfaults (exit 139).
          # The self-hosted runner shared %LOCALAPPDATA%\Godot with other engine builds, whose stale doc cache made the
          # thread slow enough to hit this every run. ._sc_ gives this editor its own data next to the exe, and
          # --quit-after (overrides the 1 frame set by --import) keeps the editor up until the thread has handed back.
          # The marker is removed when the step ends, so the later steps (gdUnit4 adapter, in-engine runner) start the
          # editor in the normal mode and its connection to the adapter is not delayed by a cold first start.
          marker="$(dirname "$editor")/._sc_"
          touch "$marker"
          trap 'rm -f "$marker"' EXIT
          "$editor" --headless --path game --import --quit-after 1000
          "$editor" --headless --path game -- --smoke | tee boot.log
          grep -q "BOOT OK .*real_t=double" boot.log

      # gdUnit4 uses one fixed machine-wide named pipe (gdunit4-message-pipe). The self-hosted runner shares the PC with
      # local gdUnit runs; a second run at the same time fails (exit 100) and the adapter then hangs until the session timeout.
      - name: Wait for a free gdUnit pipe
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(30)
          while (Test-Path '\\.\pipe\gdunit4-message-pipe') {
            if ((Get-Date) -gt $deadline) { Write-Error 'gdunit4-message-pipe still busy after 30 min'; exit 1 }
            Write-Host 'gdunit4-message-pipe busy (local gdUnit run), waiting...'
            Start-Sleep -Seconds 20
          }

      - name: Engine tests (gdUnit4Net, K2-08)
        env:
          GODOT_BIN: ${{ github.workspace }}/engine-ci/editor/${{ matrix.editor }}
        run: dotnet test game/Horyzont.Game.csproj --settings game/.runsettings --logger "trx;LogFileName=engine-tests.trx" --results-directory game/TestResults

      # Engine tests (game/tests) run in the real engine without graphics. The required step is the logic tests only.
      - name: Engine tests (in-engine runner, K2-12)
        run: |
          editor=engine-ci/editor/${{ matrix.editor }}
          "$editor" --headless --path game -- --engine-tests | tee engine-tests.log
          grep -Eq "ENGINE TESTS passed=[1-9][0-9]* failed=0" engine-tests.log

      # The 64^3 frame-time tests (--slow) measure wall-clock time on a shared runner (Random35 max frame 41 of 50 ms locally);
      # they report, they do not block, until they were green repeatedly on both runners (K2-12 Odstepstwa).
      - name: Engine tests (in-engine runner, slow, frame-time report)
        continue-on-error: true
        run: |
          editor=engine-ci/editor/${{ matrix.editor }}
          "$editor" --headless --path game -- --engine-tests --slow | tee engine-tests-slow.log
          grep -Eq "ENGINE TESTS passed=[1-9][0-9]* failed=0" engine-tests-slow.log

      # Dedicated server smoke (K2-10): console commands, restart with the same state hash, signal, damaged world and backup restore.
      # The Windows runner runs the project with the editor; the exported server is checked on Linux (preset server-linux) below.
      - name: Dedicated server smoke (editor)
        run: python tools/server_smoke.py --godot engine-ci/editor/${{ matrix.editor }}

      # Linux CI off until a free Linux runner exists (owner decision 2026-10-09, self-hosted Windows only).
      # - name: Dedicated server smoke (Linux, export of the server-linux preset)
      #   if: runner.os == 'Linux'
      #   run: |
      #     run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow engine.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
      #     gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-linux-template -D engine-ci/template
      #     template="$PWD/engine-ci/template/godot.linuxbsd.template_release.double.x86_64.mono"
      #     chmod +x "$template"
      #     # The CI checkout is disposable: point the preset at the downloaded template.
      #     sed -i "/^\[preset.3.options\]/,\$ s#^custom_template/release=\"\"#custom_template/release=\"$template\"#" game/export_presets.cfg
      #     mkdir -p build/server-linux
      #     engine-ci/editor/${{ matrix.editor }} --headless --path game --export-release server-linux ../build/server-linux/HoryzontServer.x86_64
      #     python tools/server_smoke.py --export build/server-linux/HoryzontServer.x86_64

      # K4-19 criterion 2: solo, host + client and dedicated server + client each reach "CLIENT IN GAME".
      - name: Modes smoke
        run: |
          python tools/modes_smoke.py --self-test
          python tools/modes_smoke.py --godot engine-ci/editor/${{ matrix.editor }}

      # Dumps of a crashing godot*.exe (K4-19: access violation at server exit) for the artifact; HKCU only, removed afterwards.
      - name: Enable WER LocalDumps
        shell: pwsh
        run: tools/ci/wer_localdumps.ps1 -Action enable -Dir wer-dumps

      # K4-19 criteria 1, 5 and 7 in miniature: 8 bots of the .NET runner, a graceful restart and a kill, 3 minutes.
      # Phase C raises --engine-bots to 1 once the bot mode of the game exists.
      - name: Co-op smoke
        run: |
          python tools/coop/coop_soak.py --self-test
          python tools/coop/coop_soak.py --godot engine-ci/editor/${{ matrix.editor }} --minutes 3 --bots 8 --engine-bots 0 --out coop-smoke

      - name: Upload co-op smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-smoke-${{ runner.os }}
          path: |
            coop-smoke/summary.*
            coop-smoke/**/bots.json
          if-no-files-found: ignore

      - name: Disable WER LocalDumps
        if: always()
        shell: pwsh
        run: tools/ci/wer_localdumps.ps1 -Action disable

      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wer-dumps-smoke-${{ runner.os }}
          path: wer-dumps/**
          retention-days: 14
          if-no-files-found: ignore

      # Reports, does not block: the generation rate per LOD of the engine (budgets are checked in nightly.yml / bench).
      - name: Benchmark report
        continue-on-error: true
        run: |
          mkdir -p bench-report
          python tools/bench/check_budgets.py --self-test
          engine-ci/editor/${{ matrix.editor }} --headless --path game -- --benchmark-report "$PWD/bench-report"
          cat bench-report/benchmark-report.json

      - name: Generator report
        env:
          GODOT_BIN: ${{ github.workspace }}/engine-ci/editor/${{ matrix.editor }}
        run: |
          mkdir -p generator-report
          "$GODOT_BIN" --headless --path game -- --generator-report "$PWD/generator-report"
          ls generator-report

      - name: Upload generator report
        uses: actions/upload-artifact@v4
        with:
          name: generator-report-${{ runner.os }}-editor
          path: generator-report/*.json
          if-no-files-found: error

      - name: Upload engine test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-tests-${{ runner.os }}
          path: game/TestResults/*.trx
          if-no-files-found: ignore

  generator-consistency:
    # Linux CI off until a free Linux runner exists (owner decision 2026-10-09, self-hosted Windows only).
    if: false
    # Windows and Linux editors must generate the same LOD 0 blocks (K2-08, collisions depend on it).
    needs: game
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        # Self-hosted Windows uses the system Python 3.12: the action's installer needs admin rights (HKLM) and hangs there.
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: generator-report-*-editor
          path: reports
          merge-multiple: true

      - name: Self-test of the comparison tool
        run: python -I tools/generator/compare_reports.py --self-test

      - name: Compare Windows and Linux editor reports
        run: |
          ls reports
          python -I tools/generator/compare_reports.py reports/generator-windows-editor.json reports/generator-linux-editor.json --out generator-consistency.md
          cat generator-consistency.md >> "$GITHUB_STEP_SUMMARY"
