name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HORYZONT_COMMIT: ${{ github.sha }}

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Horyzont.sln

      - name: Build
        run: dotnet build Horyzont.sln -c Release --no-restore

      - name: Test
        run: dotnet test Horyzont.sln -c Release --no-build --filter "Category!=Soak&Category!=Manual"

      - name: Format
        run: dotnet format Horyzont.sln --verify-no-changes --no-restore

  game:
    # Needs the engine from engine.yml on main: the matrix runners above have no engine packages.
    name: game (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            engine-artifact: engine-windows-editor
            editor: godot.windows.editor.double.x86_64.mono.console.exe
          - os: ubuntu-24.04
            engine-artifact: engine-linux-editor
            editor: godot.linuxbsd.editor.double.x86_64.mono
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download engine from the last successful engine.yml run on main
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow engine.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful engine.yml run on main; merge K1-01 and let engine.yml finish first."
            exit 1
          fi
          echo "engine run $run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n ${{ matrix.engine-artifact }} -D engine-ci/editor
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-nupkgs -D engine-ci/nupkgs

      - name: Prepare the Linux editor
        if: runner.os == 'Linux'
        run: |
          chmod +x engine-ci/editor/${{ matrix.editor }}
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1 libasound2t64 libpulse0 libudev1 libfontconfig1

      - name: Activate engine packages
        run: python tools/engine/build.py activate --from engine-ci/nupkgs

      - name: Build game
        run: dotnet build game/Horyzont.Game.csproj -nologo

      - name: Format game
        run: dotnet format game/Horyzont.Game.csproj --verify-no-changes --no-restore

      - name: Boot smoke
        run: |
          editor=engine-ci/editor/${{ matrix.editor }}
          "$editor" --headless --path game --import
          "$editor" --headless --path game -- --smoke | tee boot.log
          grep -q "BOOT OK .*real_t=double" boot.log

      # Engine tests (game/tests) run in the real engine without graphics; --slow adds the 64^3 frame-time tests.
      - name: Engine tests
        run: |
          editor=engine-ci/editor/${{ matrix.editor }}
          "$editor" --headless --path game -- --engine-tests --slow | tee engine-tests.log
          grep -Eq "ENGINE TESTS passed=[1-9][0-9]* failed=0" engine-tests.log
