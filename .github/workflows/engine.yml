name: Engine

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "tools/engine/**"
      - "nuget.config"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "tools/engine/**"
      - "nuget.config"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/engine.yml"
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Four targets share the 10 GB GitHub cache: about 2 GiB of SCons cache each.
  HORYZONT_SCONS_CACHE_LIMIT: "2"

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: editor-windows
            runner: windows-2022
          - target: template-windows-debug
            runner: windows-2022
          - target: template-windows-release
            runner: windows-2022
          - target: template-linux-release
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install SCons
        run: python -m pip install scons

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev
          libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev
          libwayland-dev

      - name: Compute engine key
        id: key
        shell: bash
        run: echo "key=$(cat engine/engine.json tools/engine/build.py | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache engine output
        uses: actions/cache@v4
        with:
          path: engine/out/${{ steps.key.outputs.key }}
          key: engine-out-${{ matrix.target }}-${{ steps.key.outputs.key }}

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: cache/scons
          key: scons-${{ matrix.target }}-${{ steps.key.outputs.key }}
          restore-keys: scons-${{ matrix.target }}-

      - name: Build
        run: python tools/engine/build.py all --target ${{ matrix.target }}

      - name: Upload editor
        if: matrix.target == 'editor-windows'
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows-editor
          path: |
            engine/out/${{ steps.key.outputs.key }}/godot.windows.editor.double.x86_64.mono*.exe
            engine/out/${{ steps.key.outputs.key }}/GodotSharp/
            engine/out/${{ steps.key.outputs.key }}/manifest.json
          if-no-files-found: error

      - name: Upload NuGet packages
        if: matrix.target == 'editor-windows'
        uses: actions/upload-artifact@v4
        with:
          name: engine-nupkgs
          path: engine/out/${{ steps.key.outputs.key }}/nupkgs/*.nupkg
          if-no-files-found: error

      - name: Upload Windows debug template
        if: matrix.target == 'template-windows-debug'
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows-template-debug
          path: engine/out/${{ steps.key.outputs.key }}/godot.windows.template_debug.double.x86_64.mono*.exe
          if-no-files-found: error

      - name: Upload Windows release template
        if: matrix.target == 'template-windows-release'
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows-template-release
          path: engine/out/${{ steps.key.outputs.key }}/godot.windows.template_release.double.x86_64.mono*.exe
          if-no-files-found: error

      - name: Upload Linux template
        if: matrix.target == 'template-linux-release'
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux-template
          path: engine/out/${{ steps.key.outputs.key }}/godot.linuxbsd.template_release.double.x86_64.mono
          if-no-files-found: error
