name: Nightly

# One nightly at a time on the single self-hosted runner: the soak, the bench and the engine tests must not overlap (CPU contention
# skews the tick budgets and the timing of the kill checks).
concurrency:
  group: nightly
  cancel-in-progress: false

on:
  schedule:
    # 02:00 UTC. The two-hour co-op soak and the bench now run one after the other (needs), about 3.5 hours in total with the
    # other nightly jobs; move the time if the runner is wanted earlier.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Length of the co-op soak and of the tick profile in minutes (the nightly default is 120 / 10)"
        required: false
        default: ""

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  soak:
    name: soak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux CI off until a free Linux runner exists (owner decision 2026-10-09, self-hosted Windows only).
        # os: [windows-latest, ubuntu-latest]
        os: [windows-latest]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        # Self-hosted Windows uses the installed .NET SDK: the action cannot write to C:\Program Files\dotnet without admin rights.
        if: runner.environment == 'github-hosted'
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Horyzont.sln

      - name: Build
        run: dotnet build Horyzont.sln -c Release --no-restore

      # Includes CrashHostSoakTests (K1-05); its crash host is built above as part of the solution.
      - name: Soak tests
        run: dotnet test Horyzont.sln -c Release --no-build --filter "Category=Soak"

  # K2-08: release builds (what players and the Linux server run) must generate the same terrain as the editors.
  # The Windows editor exports both release builds (engine-windows-editor + the release templates from engine.yml on main).
  release-windows:
    name: generator report (Windows editor and release)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      HORYZONT_COMMIT: ${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        # Self-hosted Windows uses the installed .NET SDK: the action cannot write to C:\Program Files\dotnet without admin rights.
        if: runner.environment == 'github-hosted'
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        # Self-hosted Windows uses the system Python 3.12: the action's installer needs admin rights (HKLM) and hangs there.
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - name: Download engine from the last successful engine.yml run on main
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow engine.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful engine.yml run on main."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-windows-editor -D engine-ci/editor
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-nupkgs -D engine-ci/nupkgs
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-windows-template-release -D engine-ci/templates
          # Linux CI off (owner decision 2026-10-09): engine.yml no longer builds the Linux template.
          # gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-linux-template -D engine-ci/templates

      - name: Activate engine packages
        run: python tools/engine/build.py activate --from engine-ci/nupkgs

      - name: Build game for the editor
        run: dotnet build game/Horyzont.Game.csproj -nologo

      - name: Point the export presets at the engine templates
        run: |
          # Godot reads this path from the file, so it needs D:/... rather than the Git Bash /d/... form.
          templates="$(cygpath -m "$PWD/engine-ci/templates")"
          sed -i "0,/^custom_template\/release=\"\"/s||custom_template/release=\"$templates/godot.windows.template_release.double.x86_64.mono.exe\"|" game/export_presets.cfg
          # Linux CI off (owner decision 2026-10-09): engine.yml no longer builds the Linux template.
          # sed -i "0,/^custom_template\/release=\"\"/s||custom_template/release=\"$templates/godot.linuxbsd.template_release.double.x86_64.mono\"|" game/export_presets.cfg
          grep -n "custom_template/release" game/export_presets.cfg

      - name: Import and export both release builds
        run: |
          editor="$PWD/engine-ci/editor/godot.windows.editor.double.x86_64.mono.console.exe"
          mkdir -p build/windows-release
          "$editor" --headless --path game --import
          "$editor" --headless --path game --export-release windows-release ../build/windows-release/Horyzont.exe
          # Linux CI off (owner decision 2026-10-09): engine.yml no longer builds the Linux template.
          # "$editor" --headless --path game --export-release linux-release ../build/linux-release/Horyzont.x86_64
          ls build/windows-release

      - name: Reports of the editor and of the Windows release build
        run: |
          editor="$PWD/engine-ci/editor/godot.windows.editor.double.x86_64.mono.console.exe"
          mkdir -p reports
          "$editor" --headless --path game -- --generator-report "$PWD/reports"
          build/windows-release/Horyzont.exe --headless -- --generator-report "$PWD/reports"
          ls reports

      - uses: actions/upload-artifact@v4
        with:
          name: release-reports-windows
          path: reports/*.json
          if-no-files-found: error

      # Linux CI off (owner decision 2026-10-09): no Linux release build to hand to release-linux.
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: release-build-linux
      #     path: build/linux-release
      #     if-no-files-found: error

  release-linux:
    # Linux CI off until a free Linux runner exists (owner decision 2026-10-09, self-hosted Windows only).
    if: false
    name: generator report (Linux editor and release)
    needs: release-windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      HORYZONT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        # Self-hosted Windows uses the installed .NET SDK: the action cannot write to C:\Program Files\dotnet without admin rights.
        if: runner.environment == 'github-hosted'
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        # Self-hosted Windows uses the system Python 3.12: the action's installer needs admin rights (HKLM) and hangs there.
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - name: Download the Linux editor from the last successful engine.yml run on main
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow engine.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful engine.yml run on main."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-linux-editor -D engine-ci/editor
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-nupkgs -D engine-ci/nupkgs
          chmod +x engine-ci/editor/godot.linuxbsd.editor.double.x86_64.mono

      - name: Activate engine packages
        run: python tools/engine/build.py activate --from engine-ci/nupkgs

      - name: Build game for the editor
        run: dotnet build game/Horyzont.Game.csproj -nologo

      - uses: actions/download-artifact@v4
        with:
          name: release-build-linux
          path: build/linux-release

      - name: Reports of the editor and of the Linux release build
        run: |
          editor="$PWD/engine-ci/editor/godot.linuxbsd.editor.double.x86_64.mono"
          # upload-artifact drops the executable bit.
          chmod +x build/linux-release/Horyzont.x86_64
          mkdir -p reports
          "$editor" --headless --path game --import
          "$editor" --headless --path game -- --generator-report "$PWD/reports"
          build/linux-release/Horyzont.x86_64 --headless -- --generator-report "$PWD/reports"
          ls reports

      - uses: actions/upload-artifact@v4
        with:
          name: release-reports-linux
          path: reports/*.json
          if-no-files-found: error

  release-compare:
    # Linux CI off until a free Linux runner exists (owner decision 2026-10-09, self-hosted Windows only).
    if: false
    name: compare the four runtimes
    needs: release-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        # Self-hosted Windows uses the system Python 3.12: the action's installer needs admin rights (HKLM) and hangs there.
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-reports-*
          path: reports
          merge-multiple: true

      - name: Compare windows-editor, windows-release, linux-editor and linux-release
        run: |
          ls reports
          python -I tools/generator/compare_reports.py reports/generator-windows-editor.json reports/generator-windows-template_release.json reports/generator-linux-editor.json reports/generator-linux-template_release.json --out release-consistency.md
          cat release-consistency.md >> "$GITHUB_STEP_SUMMARY"

  # K4-19 criterion 1 and 7: 8 .NET bots against a dedicated server for two hours, a graceful restart in the 40th minute and a
  # kill in the 80th (the defaults of coop_soak.py at a third and two thirds of the run). Phase C raises --engine-bots to 2.
  coop-soak:
    name: coop soak
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 200
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      MSBUILDDISABLENODEREUSE: 1
      DOTNET_CLI_USE_MSBUILD_SERVER: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        if: runner.environment == 'github-hosted'
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - name: Download engine from the last successful engine.yml run on main
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow engine.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful engine.yml run on main."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-windows-editor -D engine-ci/editor
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-nupkgs -D engine-ci/nupkgs

      - name: Activate engine packages
        run: python tools/engine/build.py activate --from engine-ci/nupkgs

      - name: Build game
        run: dotnet build game/Horyzont.Game.csproj -nologo

      # Dumps of a crashing godot*.exe (K4-19: access violation at server exit) for the artifact; HKCU only, removed afterwards.
      - name: Enable WER LocalDumps
        shell: pwsh
        run: tools/ci/wer_localdumps.ps1 -Action enable -Dir wer-dumps

      - name: Co-op soak
        run: |
          python tools/coop/coop_soak.py --self-test
          python tools/coop/coop_soak.py --godot engine-ci/editor/godot.windows.editor.double.x86_64.mono.console.exe             --minutes "${{ inputs.minutes || '120' }}" --bots 8 --engine-bots 0 --out coop-soak

      - name: Upload co-op soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-soak
          path: coop-soak/**
          retention-days: 30
          if-no-files-found: ignore

      - name: Disable WER LocalDumps
        if: always()
        shell: pwsh
        run: tools/ci/wer_localdumps.ps1 -Action disable

      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wer-dumps-coop-soak
          path: wer-dumps/**
          retention-days: 14
          if-no-files-found: ignore

  # K4-19 criterion 8 and the budgets: BenchmarkDotNet (short job), the engine report and the server tick of 8 bots on 6 cores.
  bench:
    name: bench
    # After the soak (both want the whole machine), and also when the soak failed: the budgets are a separate verdict.
    needs: coop-soak
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      MSBUILDDISABLENODEREUSE: 1
      DOTNET_CLI_USE_MSBUILD_SERVER: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        if: runner.environment == 'github-hosted'
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - name: Download engine from the last successful engine.yml run on main
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow engine.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful engine.yml run on main."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-windows-editor -D engine-ci/editor
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n engine-nupkgs -D engine-ci/nupkgs

      - name: Activate engine packages
        run: python tools/engine/build.py activate --from engine-ci/nupkgs

      - name: Build game
        run: dotnet build game/Horyzont.Game.csproj -nologo

      - name: BenchmarkDotNet
        run: dotnet run -c Release --project tests/Horyzont.Benchmarks -- --filter "*" --job short --exporters json markdown

      - name: Engine benchmark report
        run: |
          mkdir -p engine-bench
          engine-ci/editor/godot.windows.editor.double.x86_64.mono.console.exe --headless --path game -- --benchmark-report "$PWD/engine-bench"

      # Dumps of a crashing godot*.exe (K4-19: access violation at server exit) for the artifact; HKCU only, removed afterwards.
      - name: Enable WER LocalDumps
        shell: pwsh
        run: tools/ci/wer_localdumps.ps1 -Action enable -Dir wer-dumps

      - name: Server tick profile (8 bots, 6 cores)
        # A failed tick run must not hide the benchmark verdicts; Check budgets reports the missing tick summary.
        continue-on-error: true
        run: |
          python tools/coop/coop_soak.py --godot engine-ci/editor/godot.windows.editor.double.x86_64.mono.console.exe             --profile tick --affinity 0x3F --minutes "${{ inputs.minutes || '10' }}" --bots 8 --engine-bots 0 --out coop-tick

      - name: Check budgets
        if: always()
        run: |
          python tools/bench/check_budgets.py --self-test
          python tools/bench/check_budgets.py --bench-dir tests/Horyzont.Benchmarks/BenchmarkDotNet.Artifacts/results             --baseline docs/reports/K4-19/bench-baseline.json --engine-report engine-bench/benchmark-report.json             --coop-summary coop-tick/summary.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: |
            tests/Horyzont.Benchmarks/BenchmarkDotNet.Artifacts/results/**
            engine-bench/**
            coop-tick/summary.*
          retention-days: 30
          if-no-files-found: ignore

      - name: Disable WER LocalDumps
        if: always()
        shell: pwsh
        run: tools/ci/wer_localdumps.ps1 -Action disable

      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wer-dumps-bench
          path: wer-dumps/**
          retention-days: 14
          if-no-files-found: ignore
